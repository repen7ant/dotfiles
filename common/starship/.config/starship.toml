"$schema" = 'https://starship.rs/config-schema.json'
scan_timeout = 100

format = '$directory$git_branch$git_status$cmd_duration$all$line_break$username$hostname$character'

[username]
show_always = true
format = '[$user]($style)'
style_user = 'fg:#7FB4CA'
style_root = 'fg:#FF5D62'

[hostname]
ssh_only = false
format = '[@$hostname]($style) '
style = 'fg:#7FB4CA'

[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
read_only = " 󰌾"
style = 'fg:#c0a36e'

[character]
success_symbol = '[>](fg:#DCA561)'
error_symbol = '[>](fg:#C34043)'

